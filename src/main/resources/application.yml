server:
  port: 8080

spring:
  application:
    name: openmrs-cce-receiver-adaptor

openmrs:
  rest:
    base-url: ${OPENMRS_REST_BASE_URL:http://localhost:8080/openmrs/ws/rest/v1}
    timeout: ${OPENMRS_REST_TIMEOUT:30000}
  fhir:
    base-url: ${OPENMRS_FHIR_BASE_URL:http://localhost:8080/openmrs/ws/fhir2/R4}
    timeout: ${OPENMRS_FHIR_TIMEOUT:30000}
  auth:
    type: ${OPENMRS_AUTH_TYPE:basic}
    username: ${OPENMRS_USERNAME:admin}
    password: ${OPENMRS_PASSWORD:Admin123}
    oauth2:
      token-url: ${OPENMRS_OAUTH2_TOKEN_URL:}
      client-id: ${OPENMRS_OAUTH2_CLIENT_ID:}
      client-secret: ${OPENMRS_OAUTH2_CLIENT_SECRET:}
      scope: ${OPENMRS_OAUTH2_SCOPE:}
  identifier:
    location-uuid: ${OPENMRS_IDENTIFIER_LOCATION_UUID:}
    idgen-source-uuid: ${OPENMRS_IDGEN_SOURCE_UUID:}
    type-name: ${OPENMRS_IDENTIFIER_TYPE_NAME:OpenMRS ID}
  capability-refresh-ms: ${OPENMRS_CAPABILITY_REFRESH_MS:21600000}
  provider:
    fallback-name: ${OPENMRS_PROVIDER_FALLBACK_NAME:SPICE System Provider}
    fallback-identifier: ${OPENMRS_PROVIDER_FALLBACK_IDENTIFIER:SPICE-SYSTEM}
    # A source practitioner (ServiceRequest.performer Practitioner/<id>) is the OpenMRS provider whose
    # identifier is <id>, or <prefix><id> when a prefix is set (e.g. SPICE: -> SPICE:1198503150001234;
    # providers with the bare id still match).
    external-identifier-prefix: ${OPENMRS_PROVIDER_EXTERNAL_IDENTIFIER_PREFIX:}
    # Create that provider (person + provider, no user) the first time the practitioner is seen.
    auto-create-external: ${OPENMRS_PROVIDER_AUTO_CREATE_EXTERNAL:true}
  referral:
    # When true, inbound ServiceRequests detected as referrals create:
    #   - a closed "Referral Intake" visit (no active visit: the clerk starts the visit when the
    #     patient arrives, which is the check-in)
    #   - an Encounter of type "Referral In" in that visit (in the active visit if the patient has one)
    #   - the Referral Order (handled by FhirToRestTransformer)
    # Set false to fall back to the generic encounter/visit flow for referrals.
    enabled: ${OPENMRS_REFERRAL_ENABLED:true}
    # Visit type of the closed intake visit (the O3 Orders widget reads order.encounter.visit).
    # Blank = the visit type named intake-visit-type-name, created (retired, so it stays out of
    # O3's start-visit picker) if missing.
    intake-visit-type-uuid: ${OPENMRS_REFERRAL_INTAKE_VISIT_TYPE_UUID:}
    intake-visit-type-name: ${OPENMRS_REFERRAL_INTAKE_VISIT_TYPE_NAME:Referral Intake}
    location-uuid:        ${OPENMRS_REFERRAL_LOCATION_UUID:44c3efb0-2583-4c80-a79e-1f756a03c0a1}
    # Facility the referral visit is held at; blank = nearest "Visit Location" at or above location-uuid
    visit-location-uuid:  ${OPENMRS_REFERRAL_VISIT_LOCATION_UUID:}
    encounter-type-uuid:  ${OPENMRS_REFERRAL_ENCOUNTER_TYPE_UUID:de0f5558-9813-4fa3-8613-467015f9fabd}
  notification:
    # When true, the adaptor fires a fire-and-forget POST /alert after a
    # successful referral order create. See docs/openmrs-notification-integration.md.
    enabled: ${OPENMRS_NOTIFICATION_ENABLED:true}
    expire-hours: ${OPENMRS_NOTIFICATION_EXPIRE_HOURS:48}
    recipients:
      # Policy: role | static | role-or-static
      policy: ${OPENMRS_NOTIFICATION_RECIPIENTS_POLICY:static}
      role: ${OPENMRS_NOTIFICATION_RECIPIENTS_ROLE:Clinician}
      # Comma-separated fallback list of OpenMRS user UUIDs.
      static-uuids: ${OPENMRS_NOTIFICATION_RECIPIENTS_STATIC_UUIDS:82f18b44-6814-11e8-923f-e9a88dcb533f}
      cache-ttl-seconds: ${OPENMRS_NOTIFICATION_RECIPIENTS_CACHE_TTL_SECONDS:300}
    dedupe:
      ttl-hours: ${OPENMRS_NOTIFICATION_DEDUPE_TTL_HOURS:24}

spice:
  fhir:
    enabled: ${SPICE_FHIR_ENABLED:false}
    base-url: ${SPICE_FHIR_BASE_URL:}
    token: ${SPICE_FHIR_TOKEN:}
    client: ${SPICE_FHIR_CLIENT:job}
    lookup-resource: ${SPICE_FHIR_LOOKUP_RESOURCE:RelatedPerson}
    identifier-system: ${SPICE_FHIR_IDENTIFIER_SYSTEM:http://mdtlabs.com/national-id}
    timeout: ${SPICE_FHIR_TIMEOUT:30000}

cce:
  security:
    enabled: ${CCE_SECURITY_ENABLED:false}
    token: ${CCE_SECURITY_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.openphc.cce.receiver: ${LOG_LEVEL:INFO}
    org.springframework.web.client: ${HTTP_LOG_LEVEL:WARN}
